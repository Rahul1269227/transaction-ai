      - "(?i)pharmeasy.*"

  - name: "Education"
    id: "education"
    description: "School fees, courses, books, tuition"
    subcategories:
      - "School/College Fees"
      - "Online Courses"
      - "Books & Stationery"
      - "Tuition"
    keywords:
      - "school fee"
      - "college fee"
      - "tuition"
      - "udemy"
      - "coursera"
      - "byju"
      - "unacademy"
      - "vedantu"
      - "education"
      - "learning"
      - "exam fee"
    patterns:
      - "(?i).*school.*fee.*"
      - "(?i).*college.*fee.*"
      - "(?i).*tuition.*"
      - "(?i).*course.*"

  - name: "Fees & Charges"
    id: "fees_charges"
    description: "Bank charges, transaction fees, penalties, and service fees (NOT utility bills)"
    subcategories:
      - "Bank Charges"
      - "Credit Card Fees"
      - "Late Fees"
      - "Service Charges"
      - "GST"
      - "Transaction Fees"
    keywords:
      - "bank charge"
      - "service charge"
      - "transaction fee"
      - "annual fee"
      - "late fee"
      - "penalty"
      - "gst"
      - "debit card fee"
      - "debit card charge"
      - "processing fee"
      - "convenience fee"
      - "handling fee"
      - "admin charge"
      - "maintenance charge"
    patterns:
      - "(?i)\\bbank\\s+charge"
      - "(?i)\\bservice\\s+charge"
      - "(?i)\\btransaction\\s+fee"
      - "(?i)\\bpenalty\\b"
      - "(?i)\\bgst\\b"
      - "(?i)\\bprocessing\\s+fee"
      - "(?i)\\bconvenience\\s+fee"
      - "(?i)\\bdebit\\s+card\\s+(fee|charge)"
      - "(?i)\\bannual\\s+fee"
      - "(?i)\\blate\\s+fee"

  - name: "Income/Salary"
    id: "income_salary"
    description: "Salary credits, income, refunds"
    subcategories:
      - "Salary"
      - "Bonus"
      - "Refunds"
      - "Cashback"
      - "Interest Earned"
    keywords:
      - "salary"
      - "income"
      - "credit"
      - "refund"
      - "cashback"
      - "bonus"
      - "incentive"
      - "commission"
      - "interest credit"
    patterns:
      - "(?i).*salary.*"
      - "(?i).*refund.*"
      - "(?i).*cashback.*"
      - "(?i).*bonus.*"

  - name: "Transfers/UPI"
    id: "transfers_upi"
    description: "UPI transfers, IMPS, NEFT, peer-to-peer transfers"
    subcategories:
      - "UPI Transfer"
      - "IMPS"
      - "NEFT"
      - "RTGS"
      - "Peer to Peer"
    keywords:
      - "upi"
      - "imps"
      - "neft"
      - "rtgs"
      - "transfer"
      - "sent to"
      - "received from"
      - "phonepe"
      - "googlepay"
      - "paytm"
      - "bhim"
    patterns:
      - "(?i)upi.*"
      - "(?i)imps.*"
      - "(?i)neft.*"
      - "(?i)rtgs.*"
      - "(?i).*transfer.*"

  - name: "ATM/Cash"
    id: "atm_cash"
    description: "ATM withdrawals and cash transactions"
    subcategories:
      - "ATM Withdrawal"
      - "Cash Deposit"
      - "Cash Back"
    keywords:
      - "atm"
      - "cash withdrawal"
      - "withdrawal"
      - "pos cash"
      - "cash back"
    patterns:
      - "(?i)atm.*"
      - "(?i).*withdrawal.*"
      - "(?i).*cash.*"

  - name: "Investments"
    id: "investments"
    description: "Mutual funds, stocks, SIP, trading"
    subcategories:
      - "Mutual Funds"
      - "Stocks/Trading"
      - "SIP"
      - "Fixed Deposits"
      - "Insurance Premium"
    keywords:
      - "zerodha"
      - "groww"
      - "upstox"
      - "mutual fund"
      - "sip"
      - "investment"
      - "trading"
      - "stock"
      - "fd"
      - "fixed deposit"
      - "insurance"
      - "premium"
      - "lic"
      - "hdfc life"
      - "icici prudential"
    patterns:
      - "(?i)zerodha.*"
      - "(?i)groww.*"
      - "(?i).*mutual.*fund.*"
      - "(?i).*sip.*"
      - "(?i).*insurance.*"

  - name: "Bills"
    id: "bills"
    description: "Utility bills, recurring payments, and bill payments"
    subcategories:
      - "Utility Bills"
      - "Credit Card Bills"
      - "Loan EMI"
      - "Subscription"
      - "Maintenance"
      - "Phone/Internet"
      - "Electricity/Water"
    keywords:
      - "bill payment"
      - "utility bill"
      - "electricity bill"
      - "water bill"
      - "phone bill"
      - "internet bill"
      - "mobile bill"
      - "gas bill"
      - "bsnl bill"
      - "airtel bill"
      - "vodafone bill"
      - "jio bill"
      - "reliance bill"
      - "tata bill"
      - "idea bill"
      - "emi"
      - "loan"
      - "credit card"
      - "subscription"
      - "maintenance"
      - "dues"
      - "outstanding"
      - "due payment"
      - "invoice"
    patterns:
      - "(?i).*bill.*payment.*"
      - "(?i).*utility.*bill.*"
      - "(?i)(electricity|water|phone|internet|mobile|gas).*bill.*"
      - "(?i)(bsnl|airtel|vodafone|jio|reliance|tata|idea).*(bill|payment).*"
      - "(?i).*emi.*"
      - "(?i).*loan.*"
      - "(?i).*outstanding.*payment.*"
      - "(?i).*due.*payment.*"

  - name: "Fraud & Security"
    id: "fraud_security"
    description: "Suspicious transactions, fraud alerts, security concerns"
    subcategories:
      - "Suspicious International"
      - "Potential Fraud"
      - "Security Alert"
      - "Disputed Transaction"
    keywords:
      - "fraud"
      - "suspicious"
      - "disputed"
      - "unauthorized"
      - "chargeback"
      - "security alert"
      - "intl trx"
      - "international transaction"
    patterns:
      - "(?i)\\bintl\\s+trx\\b"
      - "(?i)international\\s+transaction"
      - "(?i)fraud"
      - "(?i)suspicious"
      - "(?i)disputed"

  - name: "Other"
    id: "other"
    description: "Miscellaneous transactions not fitting other categories"
    subcategories:
      - "Miscellaneous"
      - "Uncategorized"
    keywords:
      - "other"
      - "misc"
      - "miscellaneous"
    patterns:
      - "(?i).*"

# Confidence thresholds
confidence_thresholds:
  auto_accept: 0.85
  llm_rerank: 0.60
  human_review: 0.60

# Channel types
channels:
  - "UPI"
  - "IMPS"
  - "NEFT"
  - "RTGS"
  - "POS"
  - "CARD"
  - "ATM"
  - "NET_BANKING"
  - "WALLET"
  - "CASH"
  - "CHEQUE"
  - "OTHER"
