      - "bookmyshow"
      - "pvr"
      - "inox"
      - "cinema"
      - "movie"
      - "steam"
      - "playstation"
      - "xbox"
      - "gaana"
      - "wynk"
    patterns:
      - "(?i)netflix.*"
      - "(?i).*prime.*video.*"
      - "(?i)hotstar.*"
      - "(?i).*cinema.*"
