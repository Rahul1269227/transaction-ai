  - name: "Health"
    id: "health"
    description: "Medical expenses, pharmacy, health insurance"
    subcategories:
      - "Doctor/Hospital"
      - "Pharmacy/Medicine"
      - "Health Insurance"
      - "Diagnostics/Lab Tests"
      - "Gym/Fitness"
    keywords:
      - "hospital"
      - "doctor"
      - "clinic"
      - "pharmacy"
      - "medical"
      - "medicine"
      - "apollo"
      - "max hospital"
      - "fortis"
      - "medlife"
      - "1mg"
      - "pharmeasy"
      - "netmeds"
      - "gym"
      - "fitness"
      - "cult.fit"
      - "healthify"
    patterns:
      - "(?i).*hospital.*"
      - "(?i).*medical.*"
      - "(?i).*pharmacy.*"
      - "(?i).*clinic.*"
