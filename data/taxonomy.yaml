# Transaction Category Taxonomy
# Comprehensive classification system for financial transactions

version: "1.0.0"
last_updated: "2025-11-11"

categories:
  - name: "Food & Dining"
    id: "food_dining"
    description: "Restaurants, food delivery, cafes, and dining expenses"
    subcategories:
      - "Food Delivery"
      - "Restaurants"
      - "Cafes & Coffee"
      - "Fast Food"
      - "Cloud Kitchen"
    keywords:
      - "zomato"
      - "swiggy"
      - "restaurant"
      - "cafe"
      - "food"
      - "dining"
      - "eatery"
      - "dominos"
      - "pizza"
      - "mcdonalds"
      - "kfc"
      - "subway"
      - "starbucks"
      - "chaayos"
      - "haldirams"
    patterns:
      - "(?i)zomato.*"
      - "(?i)swiggy.*"
      - "(?i).*restaurant.*"
      - "(?i).*cafe.*"
      - "(?i).*pizza.*"
      - "(?i).*food.*delivery.*"

  - name: "Groceries"
    id: "groceries"
    description: "Supermarkets, grocery stores, and daily essentials"
    subcategories:
      - "Supermarkets"
      - "Online Grocery"
      - "Local Stores"
      - "Wholesale"
    keywords:
      - "bigbasket"
      - "blinkit"
      - "zepto"
      - "dunzo"
      - "grofers"
      - "dmart"
      - "reliance fresh"
      - "more"
      - "grocery"
      - "supermarket"
      - "provisions"
      - "jiomart"
      - "amazon pantry"
    patterns:
      - "(?i)big.*basket.*"
      - "(?i)blinkit.*"
      - "(?i)zepto.*"
      - "(?i).*grocery.*"
      - "(?i)dmart.*"

  - name: "Transport"
    id: "transport"
    description: "Local transportation, cabs, auto, public transport"
    subcategories:
      - "Cab Services"
      - "Auto/Rickshaw"
      - "Public Transport"
      - "Parking"
      - "Tolls"
    keywords:
      - "uber"
      - "ola"
      - "rapido"
      - "metro"
      - "bus"
      - "taxi"
      - "cab"
      - "auto"
      - "rickshaw"
      - "parking"
      - "toll"
      - "fastag"
    patterns:
      - "(?i)uber(?!.*eat).*"
      - "(?i)ola(?!.*electric).*"
      - "(?i)rapido.*"
      - "(?i).*metro.*"
      - "(?i).*parking.*"
      - "(?i).*toll.*"
      - "(?i)fastag.*"

  - name: "Travel"
    id: "travel"
    description: "Travel bookings, hotels, flights, trains"
    subcategories:
      - "Flights"
      - "Hotels"
      - "Trains"
      - "Bus Travel"
      - "Travel Packages"
    keywords:
      - "makemytrip"
      - "goibibo"
      - "irctc"
      - "redbus"
      - "oyo"
      - "airbnb"
      - "hotel"
      - "flight"
      - "airline"
      - "indigo"
      - "spicejet"
      - "air india"
      - "booking.com"
      - "agoda"
      - "yatra"
      - "cleartrip"
    patterns:
      - "(?i)makemytrip.*"
      - "(?i)goibibo.*"
      - "(?i)irctc.*"
      - "(?i).*hotel.*"
      - "(?i).*flight.*"
      - "(?i).*airline.*"

  - name: "Fuel"
    id: "fuel"
    description: "Petrol, diesel, CNG, and fuel stations"
    subcategories:
      - "Petrol"
      - "Diesel"
      - "CNG"
      - "Electric Charging"
    keywords:
      - "hpcl"
      - "iocl"
      - "bpcl"
      - "shell"
      - "reliance petrol"
      - "essar"
      - "petrol pump"
      - "fuel"
      - "gas station"
      - "cng"
    patterns:
      - "(?i)hpcl.*"
      - "(?i)iocl.*"
      - "(?i)bpcl.*"
      - "(?i).*petrol.*"
      - "(?i).*fuel.*"
      - "(?i).*cng.*"

  - name: "Utilities"
    id: "utilities"
    description: "Electricity, water, gas, phone, internet bills"
    subcategories:
      - "Electricity"
      - "Water"
      - "Gas/LPG"
      - "Internet/Broadband"
      - "Mobile/Phone"
      - "DTH/Cable"
    keywords:
      # Generic keywords removed to avoid false positives:
      # "electricity" (would match "electrical appliances", "electricity retailers")
      # "water" (would match "watermelon", "water bottles")
      # "gas" (would match "gas stations", "petrol")
      - "electricity bill"
      - "power bill"
      - "water bill"
      - "lpg"
      - "gas cylinder"
      - "gas bill"
      - "broadband"
      - "internet"
      - "internet bill"
      - "wifi"
      - "mobile recharge"
      - "phone bill"
      - "mobile bill"
      - "airtel"
      - "jio"
      - "vodafone"
      - "bsnl"
      - "tata sky"
      - "dish tv"
      - "bescom"
      - "mseb"
      - "adani gas"
      - "indane"
    patterns:
      - "(?i).*electric.*bill.*"
      - "(?i).*power.*bill.*"
      - "(?i).*broadband.*"
      - "(?i).*recharge.*"
      - "(?i).*lpg.*"

  - name: "Rent"
    id: "rent"
    description: "House rent, apartment rent, and lease payments"
    subcategories:
      - "House Rent"
      - "PG/Hostel"
      - "Commercial Rent"
    keywords:
      - "rent"
      - "lease"
      - "landlord"
      - "housing"
      - "flat rent"
      - "apartment"
    patterns:
      - "(?i).*rent.*"
      - "(?i).*lease.*"
      - "(?i).*landlord.*"

  - name: "Shopping"
    id: "shopping"
    description: "Online and offline shopping, e-commerce"
    subcategories:
      - "Online Shopping"
      - "Clothing & Fashion"
      - "Electronics"
      - "Home & Kitchen"
      - "Books & Media"
    keywords:
      - "amazon"
      - "flipkart"
      - "myntra"
      - "ajio"
      - "nykaa"
      - "meesho"
      - "snapdeal"
      - "shoppers stop"
      - "lifestyle"
      - "westside"
      - "max fashion"
      - "pantaloons"
      - "shopping"
      - "online order"
    patterns:
      - "(?i)amazon(?!.*pantry).*"
      - "(?i)flipkart.*"
      - "(?i)myntra.*"
      - "(?i)ajio.*"
      - "(?i)nykaa.*"

  - name: "Entertainment"
    id: "entertainment"
    description: "Movies, streaming, gaming, events"
    subcategories:
      - "Movies & Cinema"
      - "Streaming Services"
      - "Gaming"
      - "Events & Concerts"
    keywords:
