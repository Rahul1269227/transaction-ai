services:
  # PostgreSQL database
  postgres:
    image: postgres:16-alpine
    container_name: ${POSTGRES_CONTAINER:-txn-postgres}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-txn_user}
      POSTGRES_USER: ${POSTGRES_USER:-txn_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-txn_password}
    ports:
      - "${POSTGRES_EXTERNAL_PORT:-5432}:${POSTGRES_PORT:-5432}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init_db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-txn_user} -d ${POSTGRES_DB:-txn_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ${NETWORK_NAME:-txn-network}

  # Redis for caching and queues
  redis:
    image: redis:7-alpine
    container_name: ${REDIS_CONTAINER:-txn-redis}
    ports:
      - "${REDIS_EXTERNAL_PORT:-6379}:${REDIS_PORT:-6379}"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - ${NETWORK_NAME:-txn-network}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Ollama LLM service
  llm-service:
    image: ollama/ollama:latest
    container_name: ${LLM_CONTAINER:-txn-llm}
    ports:
      - "${LLM_EXTERNAL_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=${OLLAMA_HOST:-0.0.0.0}
    networks:
      - ${NETWORK_NAME:-txn-network}
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    # GPU support (uncomment if you have NVIDIA GPU)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # LLM model loader (runs once to download model)
  llm-loader:
    image: ollama/ollama:latest
    container_name: ${LLM_CONTAINER:-txn-llm}-loader
    depends_on:
      llm-service:
        condition: service_healthy
    networks:
      - ${NETWORK_NAME:-txn-network}
    command: >
      sh -c "
        ollama pull ${LLM_MODEL:-llama3.1:8b} &&
        echo 'Model loaded successfully'
      "
    environment:
      - OLLAMA_HOST=llm-service:11434
    profiles:
      - llm-setup

  # FastAPI application
  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    container_name: ${API_CONTAINER:-txn-api}
    env_file:
      - ../.env
    ports:
      - "${API_EXTERNAL_PORT:-8000}:${API_PORT:-8000}"
    environment:
      # CRITICAL: These DATABASE/REDIS URLs MUST override the .env file values for Docker networking
      - DATABASE_URL=postgresql://txn_user:txn_password@postgres:5432/txn_user
      - REDIS_URL=redis://redis:6379/0
      # Application paths inside container
      - TAXONOMY_PATH=/app/${TAXONOMY_PATH:-data/taxonomy.yaml}
      - GAZETTEER_PATH=/app/${GAZETTEER_PATH:-data/gazetteer/merchant_aliases.csv}
      - MODEL_PATH=/app/${MODEL_PATH:-models/transaction_classifier}
      - FEW_SHOT_EXAMPLES_PATH=/app/${FEW_SHOT_EXAMPLES_PATH:-data/few_shot_examples.jsonl}
      # LLM Provider Configuration
      - LLM_PROVIDER=${LLM_PROVIDER:-ollama}
      # Azure OpenAI Configuration
      - OPENAI_API_VERSION=${OPENAI_API_VERSION:-2024-12-01-preview}
      - AZURE_OPENAI_API_ENDPOINT=${AZURE_OPENAI_API_ENDPOINT}
      - AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY}
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT}
      - AZURE_OPENAI_CHAT_DEPLOYMENT=${AZURE_OPENAI_CHAT_DEPLOYMENT:-gpt-5}
      - AZURE_OPENAI_CHAT_DEPLOYMENT_VERSION=${AZURE_OPENAI_CHAT_DEPLOYMENT_VERSION:-2024-12-01-preview}
      - AZURE_OPENAI_REQUEST_TIMEOUT=${AZURE_OPENAI_REQUEST_TIMEOUT:-120}
      # Ollama Configuration (fallback)
      - LLM_URL=http://llm-service:11434
      - LLM_MODEL=${LLM_MODEL:-llama3.1:8b}
      - LLM_TIMEOUT=${LLM_TIMEOUT:-120}
      # Ensemble Weights (hardcoded for now)
      - MCC_WEIGHT=0.15
      - RULE_WEIGHT=0.15
      - ML_WEIGHT=0.65
      - LLM_WEIGHT=0.05
      - ML_CONFIDENCE_THRESHOLD=0.80
      - RULE_CONFIDENCE_THRESHOLD=0.80
      # Ensemble configuration
      - USE_ENSEMBLE=${USE_ENSEMBLE:-true}
      - FAST_MODE=${FAST_MODE:-true}
      - FAST_MODE_THRESHOLD=${FAST_MODE_THRESHOLD:-0.90}
      - ENABLE_PARALLEL=${ENABLE_PARALLEL:-true}
      # Confidence thresholds
      - AUTO_ACCEPT_THRESHOLD=${AUTO_ACCEPT_THRESHOLD:-0.85}
      - REVIEW_THRESHOLD=${REVIEW_THRESHOLD:-0.60}
      # Caching
      - CACHE_TTL=${CACHE_TTL:-600}
      # Logging and monitoring
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - PROMETHEUS_ENABLED=${PROMETHEUS_ENABLED:-false}
      # Rules engine configuration
      - RULE_HIGH_CONFIDENCE=${RULE_HIGH_CONFIDENCE:-0.95}
      - RULE_MEDIUM_CONFIDENCE=${RULE_MEDIUM_CONFIDENCE:-0.90}
      - RULE_MAX_CONFIDENCE=${RULE_MAX_CONFIDENCE:-0.98}
      # MCC classifier configuration
      - MCC_HIGH_CONFIDENCE=${MCC_HIGH_CONFIDENCE:-0.95}
      - MCC_LOW_CONFIDENCE=${MCC_LOW_CONFIDENCE:-0.85}
      # Ensemble router advanced configuration
      - MERCHANT_CONFIDENCE_THRESHOLD=${MERCHANT_CONFIDENCE_THRESHOLD:-0.70}
      - MERCHANT_CONFIDENCE_BOOST=${MERCHANT_CONFIDENCE_BOOST:-0.10}
      - RULE_EARLY_EXIT_THRESHOLD=${RULE_EARLY_EXIT_THRESHOLD:-0.95}
      - MCC_EARLY_EXIT_THRESHOLD=${MCC_EARLY_EXIT_THRESHOLD:-0.90}
      - FULL_AGREEMENT_BOOST=${FULL_AGREEMENT_BOOST:-0.20}
      - PARTIAL_AGREEMENT_BOOST=${PARTIAL_AGREEMENT_BOOST:-0.10}
      - NO_AGREEMENT_PENALTY=${NO_AGREEMENT_PENALTY:-0.15}
      - LLM_FALLBACK_THRESHOLD=${LLM_FALLBACK_THRESHOLD:-0.60}
      - MAX_WORKERS=${MAX_WORKERS:-4}
      # LLM generation parameters
      - LLM_TEMPERATURE=${LLM_TEMPERATURE:-1.0}
      - LLM_TOP_P=${LLM_TOP_P:-0.95}
      - LLM_MAX_TOKENS=${LLM_MAX_TOKENS:-500}
      - LLM_NUM_THREADS=${LLM_NUM_THREADS:-4}
      - LLM_REQUEST_TIMEOUT=${LLM_REQUEST_TIMEOUT:-120}
      - LLM_FEW_SHOT_LIMIT=${LLM_FEW_SHOT_LIMIT:-5}
      - LLM_MAX_CONCURRENT=${LLM_MAX_CONCURRENT:-4}
      - LLM_HEALTH_CHECK_TIMEOUT=${LLM_HEALTH_CHECK_TIMEOUT:-5}
    volumes:
      - ../data:/app/data
      - ../models:/app/models
      - ../apps:/app/apps
      - ../core:/app/core
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      llm-service:
        condition: service_healthy
    command: uvicorn apps.api.main:app --host ${API_HOST:-0.0.0.0} --port ${API_PORT:-8000}
    networks:
      - ${NETWORK_NAME:-txn-network}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${API_PORT:-8000}/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Prometheus (optional monitoring)
  prometheus:
    image: prom/prometheus:latest
    container_name: ${PROMETHEUS_CONTAINER:-txn-prometheus}
    ports:
      - "${PROMETHEUS_EXTERNAL_PORT:-9090}:${METRICS_PORT:-9090}"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - ${NETWORK_NAME:-txn-network}
    profiles:
      - monitoring

  # Grafana (optional monitoring)
  grafana:
    image: grafana/grafana:latest
    container_name: ${GRAFANA_CONTAINER:-txn-grafana}
    ports:
      - "${GRAFANA_EXTERNAL_PORT:-3000}:${GRAFANA_PORT:-3000}"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-admin}
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - ${NETWORK_NAME:-txn-network}
    profiles:
      - monitoring

volumes:
  postgres_data:
  redis_data:
  ollama_data:
  prometheus_data:
  grafana_data:

networks:
  txn-network:
    name: ${NETWORK_NAME:-txn-network}
    driver: bridge
