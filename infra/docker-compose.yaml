services:
  # PostgreSQL database
  postgres:
    image: postgres:16-alpine
    container_name: txn-postgres
    environment:
      POSTGRES_DB: transactions
      POSTGRES_USER: txn_user
      POSTGRES_PASSWORD: txn_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init_db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U txn_user -d transactions"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - txn-network

  # Redis for caching and queues
  redis:
    image: redis:7-alpine
    container_name: txn-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - txn-network

  # Ollama LLM service
  llm-service:
    image: ollama/ollama:latest
    container_name: txn-llm
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    networks:
      - txn-network
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    # GPU support (uncomment if you have NVIDIA GPU)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # LLM model loader (runs once to download model)
  llm-loader:
    image: ollama/ollama:latest
    container_name: txn-llm-loader
    depends_on:
      llm-service:
        condition: service_healthy
    networks:
      - txn-network
    command: >
      sh -c "
        ollama pull llama3.1:8b &&
        echo 'Model loaded successfully'
      "
    environment:
      - OLLAMA_HOST=llm-service:11434
    profiles:
      - llm-setup

  # FastAPI application
  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    container_name: txn-api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://txn_user:txn_password@postgres:5432/transactions
      - REDIS_URL=redis://redis:6379/0
      - TAXONOMY_PATH=/app/data/taxonomy.yaml
      - GAZETTEER_PATH=/app/data/gazetteer/merchant_aliases.csv
      - MODEL_PATH=/app/models/classifier
      - LLM_URL=http://llm-service:11434
      - LLM_MODEL=llama3.1:8b
      - USE_ENSEMBLE=true
    volumes:
      - ../data:/app/data
      - ../models:/app/models
      - ../apps:/app/apps
      - ../core:/app/core
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      llm-service:
        condition: service_healthy
    command: uvicorn apps.api.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - txn-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Prometheus (optional monitoring)
  prometheus:
    image: prom/prometheus:latest
    container_name: txn-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - txn-network
    profiles:
      - monitoring

  # Grafana (optional monitoring)
  grafana:
    image: grafana/grafana:latest
    container_name: txn-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SECURITY_ADMIN_USER=admin
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - txn-network
    profiles:
      - monitoring

volumes:
  postgres_data:
  redis_data:
  ollama_data:
  prometheus_data:
  grafana_data:

networks:
  txn-network:
    driver: bridge
