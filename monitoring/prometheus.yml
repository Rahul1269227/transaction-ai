# Prometheus Configuration for Transaction AI
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'transaction-ai'
    environment: 'production'

# Alertmanager configuration (optional)
alerting:
  alertmanagers:
    - static_configs:
        - targets: []
          # - 'alertmanager:9093'

# Load rules once and periodically evaluate them
rule_files:
  - 'alerts.yml'

# Scrape configurations
scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'

  # Transaction AI API
  - job_name: 'transaction-ai-api'
    scrape_interval: 10s
    metrics_path: '/metrics'
    static_configs:
      - targets: ['api:8000']
        labels:
          service: 'transaction-ai-api'
          component: 'backend'

  # Node Exporter for system metrics
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          service: 'node-exporter'
          component: 'infrastructure'

  # Optional: Add LLM service monitoring if available
  - job_name: 'llm-service'
    scrape_interval: 30s
    static_configs:
      - targets: ['llm-service:11434']
        labels:
          service: 'llm-service'
          component: 'ml'
    # This job may fail if LLM service doesn't expose metrics
    metrics_path: '/metrics'
    scheme: http
